services:
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8280}:8080"
    environment:
      API_UPSTREAM: "${API_UPSTREAM:-http://api:8000}"
  api:
    build: ./backend
    ports:
      - "127.0.0.1:${API_PORT:-8281}:8000"
    environment:
      API_INSTANCE_ID: "${API_INSTANCE_ID:-local}"
      API_CORS_ORIGINS: '${API_CORS_ORIGINS:-[]}'
