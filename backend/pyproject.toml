[project]
name = "gt-lifecycle-api"
version = "0.1.0"
description = "GT Lifecycle Lab Python API"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0"]

[dependency-groups]
dev = ["pytest==8.4.2", "httpx==0.28.1"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/gt_lifecycle_api", "pyproject.toml", "uv.lock"]

[tool.hatch.build.targets.wheel]
packages = ["src/gt_lifecycle_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
